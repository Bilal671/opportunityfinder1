    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var nativeFetch = (typeof window !== 'undefined' && window.fetch) ? window.fetch.bind(window) : undefined;
          var _currentFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Gracefully continue
        }
      })();
    </script>
